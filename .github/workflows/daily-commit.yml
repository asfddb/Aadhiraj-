name: Daily Contribution Streak

on:
  schedule:
    - cron: '30 3 * * *' # Runs at 03:30 UTC (9:00 AM IST) daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update activity log
        run: |
          echo "$(date -u) - Daily automated streak update" >> activity_log.txt
          git config --global user.name "adhiraj"
          git config --global user.email "asfddb@users.noreply.github.com"
          git add activity_log.txt
          git commit -m "chore(streak): daily activity $(date +'%Y-%m-%d')" || exit 0
          git push
